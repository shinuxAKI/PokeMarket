name: Build PokéMarket

on:
  push:
    branches:
      - main
      - feature/master-prompt-sqlserver-ready
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore PokeMarket.sln

      - name: Build solution
        run: dotnet build PokeMarket.sln --configuration Release --no-restore

      - name: Package complete source ZIP
        run: git archive --format=zip --prefix=PokeMarket/ HEAD --output=PokeMarket_Complete.zip

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PokeMarket_Complete
          path: PokeMarket_Complete.zip
          if-no-files-found: error
          retention-days: 30
